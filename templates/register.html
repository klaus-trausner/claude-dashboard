{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>Register</h2>
    <form id="register-form">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <div id="register-message" class="mt-3"></div>
    <p class="mt-3">Already have an account? <a href="{{ url_for('login_page') }}">Login here</a></p>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async function(event) {
    event.preventDefault();
    const username = this.username.value;
    const password = this.password.value;
    const response = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    const result = await response.json();
    const messageDiv = document.getElementById('register-message');
    if (response.ok) {
        messageDiv.innerHTML = '<div class="alert alert-success">Registration successful! Please <a href="{{ url_for('login_page') }}">login</a>.</div>';
    } else {
        messageDiv.innerHTML = `<div class="alert alert-danger">${result.msg || 'Registration failed'}</div>`;
    }
});
</script>
{% endblock %}
