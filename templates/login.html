{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>Login</h2>
    <form id="login-form">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <div id="login-message" class="mt-3"></div>
    <p class="mt-3">Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a></p>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(event) {
    event.preventDefault();
    const username = this.username.value;
    const password = this.password.value;
    const response = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    const result = await response.json();
    const messageDiv = document.getElementById('login-message');
    if (response.ok) {
        localStorage.setItem('jwt_token', result.access_token);
        messageDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
        // Redirect to dashboard or home page after a short delay
        setTimeout(() => { window.location.href = "{{ url_for('dashboard') }}"; }, 1000);
    } else {
        messageDiv.innerHTML = `<div class="alert alert-danger">${result.msg || 'Login failed'}</div>`;
    }
});
</script>
{% endblock %}
